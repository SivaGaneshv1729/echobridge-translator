name: Build Offline EchoBridge Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Universal Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Build Split-per-ABI Release APKs
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload Universal & Per-ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: echobridge-android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
