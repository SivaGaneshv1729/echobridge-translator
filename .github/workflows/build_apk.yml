name: Build Offline EchoBridge Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate Official Gradle Wrapper
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.echobridge _temp_scaffold
          mkdir -p android/gradle/wrapper
          cp -f _temp_scaffold/android/gradlew android/gradlew
          cp -f _temp_scaffold/android/gradlew.bat android/gradlew.bat
          cp -f _temp_scaffold/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp -f _temp_scaffold/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew
          rm -rf _temp_scaffold

      - name: Build Universal Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Build Split-per-ABI Release APKs
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload Universal & Per-ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: echobridge-android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
