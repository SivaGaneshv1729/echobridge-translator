name: Build Offline EchoBridge Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold & Configure Android Platform
        working-directory: mobile
        run: |
          # 1. Regenerate canonical Flutter 3.24 Android platform scaffold
          rm -rf android
          flutter create --platforms=android --org com.echobridge .

          # 2. Add required permissions to AndroidManifest.xml and ensure no deprecated package attribute
          sed -i 's/package="com.echobridge.translator"//g' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml

          # 3. Patch minSdk >= 24 for sherpa_onnx & record_android, compileSdk 35 for audioplayers
          sed -i -E 's/minSdk(Version)?\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle
          sed -i -E 's/minSdk(Version)?\s+flutter\.minSdkVersion/minSdk 24/g' android/app/build.gradle
          sed -i -E 's/compileSdk(Version)?\s*=\s*flutter\.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle
          sed -i -E 's/compileSdk(Version)?\s+flutter\.compileSdkVersion/compileSdk 35/g' android/app/build.gradle
          sed -i -E 's/targetSdk(Version)?\s*=\s*flutter\.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle
          sed -i -E 's/targetSdk(Version)?\s+flutter\.targetSdkVersion/targetSdk 35/g' android/app/build.gradle

          # 4. Configure debug signing for release build so APK is sideloadable
          sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig = signingConfigs.debug\n        }/' android/app/build.gradle

          # 5. Resolve duplicate native library conflicts between onnxruntime & sherpa_onnx
          sed -i '/android {/a \    packagingOptions {\n        pickFirst "**/libonnxruntime.so"\n        pickFirst "**/libc++_shared.so"\n    }' android/app/build.gradle

          # 6. Ensure Gradle 8.5 in wrapper properties
          sed -i 's/gradle-[0-9.]*-/gradle-8.5-/g' android/gradle/wrapper/gradle-wrapper.properties

          echo "=== Patched android/app/build.gradle ==="
          cat android/app/build.gradle

      - name: Install Dependencies
        working-directory: mobile
        run: |
          flutter pub get
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/35/g' {} + 2>/dev/null || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.minSdkVersion/24/g' {} + 2>/dev/null || true

      - name: Build Universal Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Build Split-per-ABI Release APKs
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload Universal & Per-ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: echobridge-android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
