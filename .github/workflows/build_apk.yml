name: Build Offline EchoBridge Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Canonical Android Platform
        working-directory: mobile
        run: |
          # 1. Back up custom AndroidManifest.xml
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml 2>/dev/null || true

          # 2. Clean out partial android scaffolding and let Flutter CLI generate canonical files
          rm -rf android
          flutter create --platforms=android --org com.echobridge .

          # 3. Restore custom AndroidManifest.xml with microphone & foreground service permissions
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/package="com.echobridge.translator"//g' android/app/src/main/AndroidManifest.xml

          # 4. Ensure minSdkVersion >= 24 for sherpa_onnx and compileSdk 35 for audioplayers
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/g' android/app/build.gradle

          # 5. Ensure Gradle 8.5+ in wrapper
          sed -i 's/gradle-[0-9.]*-/gradle-8.5-/g' android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true

      - name: Install Dependencies
        working-directory: mobile
        run: |
          flutter pub get
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/35/g' {} + 2>/dev/null || true

      - name: Build Universal Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Build Split-per-ABI Release APKs
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload Universal & Per-ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: echobridge-android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
