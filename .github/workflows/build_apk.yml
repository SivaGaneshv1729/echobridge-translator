name: Build Offline EchoBridge Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Configure Android Build & Gradle Wrapper
        working-directory: mobile
        run: |
          # 1. Generate canonical gradle wrapper files using Flutter SDK in a temporary directory
          flutter create --platforms=android --org com.echobridge /tmp/flutter_scaffold
          
          # 2. Supply gradlew launcher script and wrapper binary to repository android folder
          cp /tmp/flutter_scaffold/android/gradlew ./android/gradlew
          chmod +x ./android/gradlew
          mkdir -p ./android/gradle/wrapper
          cp /tmp/flutter_scaffold/android/gradle/wrapper/gradle-wrapper.jar ./android/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true

          # 3. Ensure Gradle 8.5 distribution in wrapper properties
          sed -i 's/gradle-[0-9.]*-/gradle-8.5-/g' android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true

          # 4. Guarantee compileSdk 35 and minSdkVersion 24 in app/build.gradle
          sed -i -E 's/minSdk(Version)?(\s*=?\s*)(flutter\.minSdkVersion|[0-9]+)/minSdkVersion 24/g' android/app/build.gradle 2>/dev/null || true
          sed -i -E 's/compileSdk(Version)?(\s*=?\s*)(flutter\.compileSdkVersion|[0-9]+)/compileSdk 35/g' android/app/build.gradle 2>/dev/null || true
          sed -i -E 's/targetSdk(Version)?(\s*=?\s*)(flutter\.targetSdkVersion|[0-9]+)/targetSdkVersion 35/g' android/app/build.gradle 2>/dev/null || true

          # 5. Guarantee no deprecated package attribute in AndroidManifest.xml
          sed -i 's/package="com.echobridge.translator"//g' android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Install Dependencies
        working-directory: mobile
        run: |
          flutter pub get
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/35/g' {} + 2>/dev/null || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.minSdkVersion/24/g' {} + 2>/dev/null || true

      - name: Build Universal Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Build Split-per-ABI Release APKs
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload Universal & Per-ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: echobridge-android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
