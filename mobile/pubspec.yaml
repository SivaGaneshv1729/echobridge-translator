name: echobridge_mobile
description: "Zero-Cost 100% Offline Real-Time Speech Translator for Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sherpa_onnx: ^1.10.38
  onnxruntime: ^1.4.0
  record: ^5.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
